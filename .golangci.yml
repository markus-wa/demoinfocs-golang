version: "2"

run:
  build-tags:
    - debugdemoinfocs
  allow-parallel-runners: true

linters:
  default: none
  enable:
    - asciicheck
    - bodyclose
    - copyloopvar
    - dogsled
    - dupl
    - exhaustive
    - funlen
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godox
    - goprintffuncname
    - gosec
    - govet
    - ineffassign
    - misspell
    - nakedret
    - nestif
    - noctx
    - nolintlint
    - prealloc
    - revive
    - rowserrcheck
    - staticcheck
    - unconvert
    - unparam
    - unused
    - whitespace
    - wsl_v5
  settings:
    gocritic:
      disabled-checks:
        - ifElseChain
    # Equivalent to the old wsl (v4) behavior, as suggested by golangci-lint.
    wsl_v5:
      allow-first-in-block: true
      allow-whole-block: false
      branch-max-lines: 2
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # Exclude some linters from running on tests files.
      - path: _test\.go
        linters:
          - wsl_v5
          - funlen
      - path: pkg/demoinfocs/sendtables2
        linters:
          - godox
    paths:
      - msg
      - parser_interface.go
      - game_state_interface.go

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/markus-wa/demoinfocs-golang/v4)
  exclusions:
    paths:
      - msg
