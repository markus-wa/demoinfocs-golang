on:
  push:
    branches: [main, 'v[0-9]*'] # main + release/backport branches (v5, ...)
    tags: ['v*']
  pull_request:

name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # build, lint and examples, race tests and all tests + coverage run in parallel jobs

  lint-build:
    runs-on: ubuntu-latest

    # reviewdog github-check reporter requires check-run write access
    permissions:
      contents: read
      checks: write

    env:
      REVIEWDOG_REPORTER: github-check
      REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Reviewdog
        uses: reviewdog/action-setup@v1
        with:
          reviewdog_version: v0.21.0

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          install-only: true

      - name: Fetch refs for linter
        run: |
          git config remote.origin.fetch +refs/heads/*:refs/remotes/origin/*
          git fetch

      - name: Build
        run: scripts/build.sh

      - name: Lint Changed Code
        run: scripts/lint-changes.sh

      - name: Checkout test demos
        id: demos
        run: |
          git submodule update --init test/cs-demos
          echo "key=test-demos-$(git rev-parse HEAD:test/cs-demos)-s2-deathmatch" >> "$GITHUB_OUTPUT"

      # restore only: the race and coverage jobs save the cache with all archives extracted
      - name: Restore test demos
        uses: actions/cache/restore@v6
        with:
          path: |
            test/cs-demos/s2
            test/cs-demos/.*.extracted
          key: ${{ steps.demos.outputs.key }}

      - name: Install 7zip
        run: sudo apt-get install -y p7zip-full

      - name: Examples Tests
        run: scripts/examples-tests.sh

  race:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Checkout test demos
        id: demos
        run: |
          git submodule update --init test/cs-demos
          echo "key=test-demos-$(git rev-parse HEAD:test/cs-demos)-s2-deathmatch" >> "$GITHUB_OUTPUT"

      - name: Cache test demos
        uses: actions/cache@v6
        with:
          path: |
            test/cs-demos/s2
            test/cs-demos/.*.extracted
          key: ${{ steps.demos.outputs.key }}

      - name: Install 7zip
        run: sudo apt-get install -y p7zip-full

      - name: Race Tests
        run: scripts/race-tests.sh

  coverage:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Checkout test demos
        id: demos
        run: |
          git submodule update --init test/cs-demos
          echo "key=test-demos-$(git rev-parse HEAD:test/cs-demos)-s2-deathmatch" >> "$GITHUB_OUTPUT"

      - name: Cache test demos
        uses: actions/cache@v6
        with:
          path: |
            test/cs-demos/s2
            test/cs-demos/.*.extracted
          key: ${{ steps.demos.outputs.key }}

      - name: Install 7zip
        run: sudo apt-get install -y p7zip-full

      # Note: We run ALL tests again to get full coverage
      #       Race tests are too slow and skip the regression set
      - name: All Tests + Coverage
        run: scripts/coverage.sh

      - name: Upload Coverage
        uses: codecov/codecov-action@v7
        with:
          files: coverage.txt
          # secrets aren't available to fork PRs; the action falls back to tokenless upload there
          token: ${{ secrets.CODECOV_TOKEN }}

  test-csda: # Run tests of CS Demo Analyzer
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout demoinfocs-golang repo
        uses: actions/checkout@v7
        with:
          path: demoinfocs-golang

      # PRs that legitimately change CSDA's output can ship updated snapshots on a fork branch
      # with the same name as the PR branch; everything else runs against demoinfocs-v6.
      # When such a PR is merged, fast-forward the fork's demoinfocs-v6 to that branch.
      - name: Pick CSDA branch
        id: csda-ref
        env:
          # head_ref on pull_request events, the branch name on push events
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          ref=demoinfocs-v6
          case "$HEAD_REF" in
            # the fork's main/master track upstream CSDA, which isn't on v6
            ""|main|master) ;;
            *)
              if git ls-remote --exit-code --heads https://github.com/markus-wa/cs-demo-analyzer.git "refs/heads/$HEAD_REF" > /dev/null; then
                ref="$HEAD_REF"
              fi
              ;;
          esac
          echo "Using CSDA branch: $ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Checkout CSDA repo
        uses: actions/checkout@v7
        with:
          # TODO: switch back to akiver/cs-demo-analyzer@main once upstream has migrated to v6
          repository: markus-wa/cs-demo-analyzer
          path: cs-demo-analyzer
          ref: ${{ steps.csda-ref.outputs.ref }}

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version-file: cs-demo-analyzer/go.mod
          cache-dependency-path: cs-demo-analyzer/go.sum

      - name: Update CSDA mod
        run: |
          cd cs-demo-analyzer
          go mod edit -replace github.com/markus-wa/demoinfocs-golang/v6=../demoinfocs-golang
          go mod tidy

      - name: Download demos cache file
        run: |
          cd cs-demo-analyzer
          curl -L -o demos.txt https://gitlab.com/akiver/cs-demos/-/raw/main/demos.txt

      - name: Restore demos cache
        uses: actions/cache@v6
        id: demos-cache
        with:
          path: cs-demo-analyzer/cs-demos
          key: demos-${{ hashFiles('cs-demo-analyzer/demos.txt') }}

      - name: Download demos
        if: steps.demos-cache.outputs.cache-hit != 'true'
        run: |
          cd cs-demo-analyzer
          ./download-demos.sh

      - name: Test
        run: |
          cd cs-demo-analyzer
          go test ./tests
