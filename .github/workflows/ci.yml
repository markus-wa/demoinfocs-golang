on:
  push:
    branches: [main, 'v[0-9]*'] # main + release/backport branches (v5, ...)
    tags: ['v*']
  pull_request:
    # docs-only changes don't need CI (pushes to main still run it)
    paths-ignore: ['**.md', 'docs/**']

name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # build, lint and examples, race tests and all tests + coverage run in parallel jobs

  lint-build:
    runs-on: ubuntu-latest

    # reviewdog github-check reporter requires check-run write access
    permissions:
      contents: read
      checks: write

    env:
      REVIEWDOG_REPORTER: github-check
      REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Reviewdog
        uses: reviewdog/action-setup@v1
        with:
          reviewdog_version: v0.21.0

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          install-only: true

      - name: Fetch refs for linter
        run: |
          git config remote.origin.fetch +refs/heads/*:refs/remotes/origin/*
          git fetch

      - name: Build
        run: scripts/build.sh

      - name: Lint Changed Code
        run: scripts/lint-changes.sh

      - name: Checkout test demos
        id: demos
        run: |
          git submodule update --init test/cs-demos
          echo "key=test-demos-v2-$(git rev-parse HEAD:test/cs-demos)-s2-deathmatch" >> "$GITHUB_OUTPUT"

      # restore only: the race and coverage jobs save the cache with all archives extracted
      - name: Restore test demos
        id: demos-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            test/cs-demos/s2
            test/cs-demos/.*.extracted
          key: ${{ steps.demos.outputs.key }}

      - name: Install 7zip
        if: steps.demos-cache.outputs.cache-hit != 'true'
        run: sudo apt-get install -y p7zip-full

      - name: Examples Tests
        run: scripts/examples-tests.sh

  race:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Checkout test demos
        id: demos
        run: |
          git submodule update --init test/cs-demos
          echo "key=test-demos-v2-$(git rev-parse HEAD:test/cs-demos)-s2-deathmatch" >> "$GITHUB_OUTPUT"

      - name: Cache test demos
        id: demos-cache
        uses: actions/cache@v6
        with:
          path: |
            test/cs-demos/s2
            test/cs-demos/.*.extracted
          key: ${{ steps.demos.outputs.key }}

      - name: Install 7zip
        if: steps.demos-cache.outputs.cache-hit != 'true'
        run: sudo apt-get install -y p7zip-full

      - name: Race Tests
        run: scripts/race-tests.sh

  coverage:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    # TestCorruptS2Corpus is the long tail of the coverage run, so it gets its own job.
    # Codecov merges the uploads of a commit (see codecov.yml: after_n_builds).
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: main
            args: -skip ^TestCorruptS2Corpus$
          - part: corrupt-corpus
            args: -run ^TestCorruptS2Corpus$

    name: coverage (${{ matrix.part }})

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Checkout test demos
        id: demos
        run: |
          git submodule update --init test/cs-demos
          echo "key=test-demos-v2-$(git rev-parse HEAD:test/cs-demos)-s2-deathmatch" >> "$GITHUB_OUTPUT"

      - name: Cache test demos
        id: demos-cache
        uses: actions/cache@v6
        with:
          path: |
            test/cs-demos/s2
            test/cs-demos/.*.extracted
          key: ${{ steps.demos.outputs.key }}

      - name: Install 7zip
        if: steps.demos-cache.outputs.cache-hit != 'true'
        run: sudo apt-get install -y p7zip-full

      # Note: We run ALL tests again to get full coverage
      #       Race tests are too slow and skip the regression set
      - name: All Tests + Coverage
        run: scripts/coverage.sh coverage-${{ matrix.part }}.txt ${{ matrix.args }}

      - name: Upload Coverage
        uses: codecov/codecov-action@v7
        with:
          files: coverage-${{ matrix.part }}.txt
          # secrets aren't available to fork PRs; the action falls back to tokenless upload there
          token: ${{ secrets.CODECOV_TOKEN }}

  test-csda: # Run tests of CS Demo Analyzer
    runs-on: ubuntu-latest

    permissions:
      contents: read

    # The demos are split across shards, so each restores only part of the demo cache: the CS2 demos (parsed with
    # this demoinfocs version) in two shards, the CS:GO demos (parsed with demoinfocs v4 by CSDA, so a smoke test of
    # CSDA's combined v4 + v6 build rather than of this repo's parser) in one.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { game: cs2, shard: 0, shards: 2 }
          - { game: cs2, shard: 1, shards: 2 }
          - { game: csgo, shard: 0, shards: 1 }

    name: test-csda (${{ matrix.game }}, ${{ matrix.shard }})

    steps:
      - name: Checkout demoinfocs-golang repo
        uses: actions/checkout@v7
        with:
          path: demoinfocs-golang

      # PRs that legitimately change CSDA's output can ship updated snapshots on a fork branch
      # with the same name as the PR branch; everything else runs against demoinfocs-v6.
      # When such a PR is merged, point the fork's demoinfocs-v6 at that branch (a reset if they have diverged).
      - name: Pick CSDA branch
        id: csda-ref
        env:
          # head_ref on pull_request events, the branch name on push events
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          ref=demoinfocs-v6
          case "$HEAD_REF" in
            # the fork's main/master track upstream CSDA, which isn't on v6
            ""|main|master) ;;
            *)
              if git ls-remote --exit-code --heads https://github.com/markus-wa/cs-demo-analyzer.git "refs/heads/$HEAD_REF" > /dev/null; then
                ref="$HEAD_REF"
              fi
              ;;
          esac
          echo "Using CSDA branch: $ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Checkout CSDA repo
        uses: actions/checkout@v7
        with:
          # TODO: switch back to akiver/cs-demo-analyzer@main once upstream has migrated to v6
          repository: markus-wa/cs-demo-analyzer
          path: cs-demo-analyzer
          ref: ${{ steps.csda-ref.outputs.ref }}

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version-file: cs-demo-analyzer/go.mod
          cache-dependency-path: cs-demo-analyzer/go.sum

      - name: Update CSDA mod
        run: |
          cd cs-demo-analyzer
          go mod edit -replace github.com/markus-wa/demoinfocs-golang/v6=../demoinfocs-golang
          go mod tidy

      # every SHARDS-th test case of the game in tests/demos_test.go (test name, demo name) goes to this shard,
      # with the demo's .dem.info file if demos.txt lists one (Valve CS:GO demos; no CS2 demo has one, so cs2 shards
      # skip the lookup and don't need GitLab on a cache hit)
      - name: Pick shard demos
        id: shard
        env:
          GAME: ${{ matrix.game }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ matrix.shards }}
        run: |
          cd cs-demo-analyzer
          block='$1 == "var" && $2 == var {in_cases = 1; next} in_cases && /^}/ {exit}'
          awk -v var="${GAME}DemoTestCases" "$block"'
            in_cases && match($0, /^[[:space:]]*\{"[^"]+", "[^"]+"/) {
              split(substr($0, RSTART, RLENGTH), f, "\"")
              print f[2], f[4]
            }' tests/demos_test.go > game-cases.txt
          if [[ ! -s game-cases.txt ]]; then
            echo "no $GAME test cases found in tests/demos_test.go"
            exit 1
          fi
          # every entry of the block must have been parsed, otherwise a reformatted one would silently not run
          entries=$(awk -v var="${GAME}DemoTestCases" "$block"' in_cases && /^[[:space:]]*\{/' tests/demos_test.go | wc -l)
          if [[ "$entries" != "$(wc -l < game-cases.txt)" ]]; then
            echo "parsed $(wc -l < game-cases.txt) of $entries $GAME test cases in tests/demos_test.go, update the awk above"
            exit 1
          fi
          awk -v shard="$SHARD" -v shards="$SHARDS" '(NR - 1) % shards == shard' game-cases.txt > shard-cases.txt
          awk -v game="$GAME" '{print game "/" $2 ".dem"}' shard-cases.txt > demos-shard.txt
          if [[ "$GAME" == csgo ]]; then
            curl -fsSL --retry 3 --retry-all-errors -o demos.txt https://gitlab.com/akiver/cs-demos/-/raw/main/demos.txt
            awk '{print $0 ".info"}' demos-shard.txt | grep -Fx -f - demos.txt >> demos-shard.txt || true
          fi
          echo "run=^TestDemos$/^${GAME}$/^($(awk '{print $1}' shard-cases.txt | paste -sd'|'))$" >> "$GITHUB_OUTPUT"
          echo "$(wc -l < shard-cases.txt) of $(wc -l < game-cases.txt) $GAME demos in shard $SHARD:"
          cat demos-shard.txt

      - name: Restore demos cache
        uses: actions/cache@v6
        id: demos-cache
        with:
          path: cs-demo-analyzer/cs-demos
          key: csda-demos-${{ hashFiles('cs-demo-analyzer/demos-shard.txt') }}

      - name: Download demos
        if: steps.demos-cache.outputs.cache-hit != 'true'
        run: |
          cd cs-demo-analyzer
          while read -r file; do
            echo "Downloading demo $file"
            curl -fsSL --retry 3 --retry-all-errors -o "cs-demos/$file" --create-dirs "https://gitlab.com/akiver/cs-demos/-/raw/main/$file"
          done < demos-shard.txt

      - name: Test
        env:
          GAME: ${{ matrix.game }}
          RUN: ${{ steps.shard.outputs.run }}
        run: |
          set -o pipefail
          cd cs-demo-analyzer
          go test -v -run "$RUN" ./tests | tee test.log
          want=$(wc -l < shard-cases.txt)
          got=$(grep -c -E -- "--- PASS: TestDemos/${GAME}/" test.log || true)
          if [[ "$got" != "$want" ]]; then
            echo "expected $want passing $GAME demo tests, got $got"
            exit 1
          fi

      # everything in ./tests except the demos of the shards, so new tests don't silently stop running
      - name: Test (rest)
        if: matrix.game == 'cs2' && matrix.shard == 0
        run: |
          cd cs-demo-analyzer
          go test -skip '^TestDemos$/^(cs2|csgo)$' ./tests
