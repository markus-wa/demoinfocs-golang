on: [push, pull_request]

name: CI

jobs:
  ci:
    runs-on: ubuntu-latest

    # reviewdog github-check reporter requires check-run write access
    permissions:
      contents: read
      checks: write

    env:
      REVIEWDOG_REPORTER: github-check
      REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Reviewdog
        uses: reviewdog/action-setup@v1
        with:
          reviewdog_version: v0.21.0

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Download Go Deps
        run: go mod download

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          install-only: true

      - name: Install Tools
        run: |
          # install 7zip for decompressing test demos
          sudo apt-get install -y p7zip-full

          # Install interface generator
          go install github.com/vburenin/ifacemaker@v1.2.1

          # Fetch refs for linter
          git config remote.origin.fetch +refs/heads/*:refs/remotes/origin/*
          git fetch

      - name: Build
        run: scripts/build.sh

      - name: Check Generated Code
        run: scripts/check-interfaces-generated.sh

      - name: Lint Changed Code
        run: scripts/lint-changes.sh

      - name: Race Tests
        run: scripts/race-tests.sh

      # Note: We run ALL tests again to get full coverage
      #       Race tests are too slow and skip the regression set
      - name: All Tests + Coverage
        run: |
          scripts/coverage.sh
          bash <(curl -s https://codecov.io/bash)

  test-csda: # Run tests of CS Demo Analyzer
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout demoinfocs-golang repo
        uses: actions/checkout@v7
        with:
          path: demoinfocs-golang

      # PRs that legitimately change CSDA's output can ship updated snapshots on a fork branch
      # with the same name as the PR branch; everything else runs against demoinfocs-v6.
      # When such a PR is merged, fast-forward the fork's demoinfocs-v6 to that branch.
      - name: Pick CSDA branch
        id: csda-ref
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          ref=demoinfocs-v6
          if [ -n "$HEAD_REF" ] && git ls-remote --exit-code --heads https://github.com/markus-wa/cs-demo-analyzer.git "refs/heads/$HEAD_REF" > /dev/null; then
            ref="$HEAD_REF"
          fi
          echo "Using CSDA branch: $ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Checkout CSDA repo
        uses: actions/checkout@v7
        with:
          # TODO: switch back to akiver/cs-demo-analyzer@main once upstream has migrated to v6
          repository: markus-wa/cs-demo-analyzer
          path: cs-demo-analyzer
          ref: ${{ steps.csda-ref.outputs.ref }}

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version-file: cs-demo-analyzer/go.mod
          cache-dependency-path: cs-demo-analyzer/go.sum

      - name: Update CSDA mod
        run: |
          cd cs-demo-analyzer
          go mod edit -replace github.com/markus-wa/demoinfocs-golang/v6=../demoinfocs-golang
          go mod tidy

      - name: Download demos cache file
        run: |
          cd cs-demo-analyzer
          curl -L -o demos.txt https://gitlab.com/akiver/cs-demos/-/raw/main/demos.txt

      - name: Restore demos cache
        uses: actions/cache@v6
        id: demos-cache
        with:
          path: cs-demo-analyzer/cs-demos
          key: demos-${{ hashFiles('cs-demo-analyzer/demos.txt') }}

      - name: Download demos
        if: steps.demos-cache.outputs.cache-hit != 'true'
        run: |
          cd cs-demo-analyzer
          ./download-demos.sh

      - name: Test
        run: |
          cd cs-demo-analyzer
          go test ./tests
