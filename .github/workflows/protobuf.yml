name: Update Protobufs
on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 0 * * *'

permissions:
  # Pull Requests are created with the CUSTOM_GITHUB_TOKEN (PAT), not GITHUB_TOKEN
  contents: read

jobs:
  protobuf:
    name: Update Protobufs
    runs-on: ubuntu-latest
    env:
      GameTracking_dir: /tmp/GameTracking-CSGO
    steps:
      - uses: actions/checkout@v7
      - name: Download latest Protobufs
        run: |
          git clone --depth=1 https://github.com/SteamDatabase/GameTracking-CSGO.git $GameTracking_dir
          cp $GameTracking_dir/Protobufs/{cstrike15_*.proto,engine_gcmessages.proto,netmessages.proto,steammessages.proto,gcsdk_gcmessages.proto,networkbasetypes.proto,network_connection.proto} pkg/demoinfocs/msg/proto/v6
          # give them the package and strip the custom options, as committed (see generate.sh)
          (cd pkg/demoinfocs/msg && python3 prepare-protos.py)

          if [[ ! `git status --porcelain` ]]; then
              echo "PROTOBUFS_CHANGED=false" >> $GITHUB_ENV
              exit 0
          else
              echo "PROTOBUFS_CHANGED=true" >> $GITHUB_ENV
          fi

      - name: Install Go
        if: env.PROTOBUFS_CHANGED == 'true'
        uses: actions/setup-go@v7
        with:
          go-version: 1.27.x

      - name: Install Protobuf tools
        if: env.PROTOBUFS_CHANGED == 'true'
        run: |
            sudo apt-get update
            sudo apt-get install unzip

            wget -O /tmp/protoc.zip https://github.com/protocolbuffers/protobuf/releases/download/v36.0/protoc-36.0-linux-x86_64.zip
            unzip /tmp/protoc.zip -d /tmp/protoc

            go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11

      - name: Generate Go code
        id: generate
        if: env.PROTOBUFS_CHANGED == 'true'
        run: |
            cd pkg/demoinfocs/msg

            export PATH=/tmp/protoc/bin:$PATH
            ./generate.sh

      # A field kind the generator doesn't handle stops generate.sh, and with it the whole proto update;
      # see pkg/demoinfocs/internal/usercmdgen/README.md. Open one issue so the scheduled job doesn't
      # fail unnoticed for days.
      - name: Report generator gap
        if: failure() && steps.generate.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.CUSTOM_GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          title="usercmdgen cannot handle a new proto field"
          existing=$(gh issue list --state open --search "\"$title\" in:title" --limit 1 --json number --jq '.[0].number // empty')

          if [ -n "$existing" ]; then
            echo "Issue #$existing already open, see $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

            exit 0
          fi

          gh issue create \
            --title "$title" \
            --body "The scheduled proto update failed in the generator step ($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID). Extend pkg/demoinfocs/internal/usercmdgen for the field named in the error (see its README.md), then re-run."

      - name: Commit changes
        if: env.PROTOBUFS_CHANGED == 'true'
        run: |
          commit_sha=$(pushd $GameTracking_dir > /dev/null && git rev-parse HEAD && popd > /dev/null)
          echo "COMMIT_SHA=$commit_sha" >> $GITHUB_ENV

      - name: Create Pull Request
        id: pr
        if: env.PROTOBUFS_CHANGED == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.CUSTOM_GITHUB_TOKEN }}
          title: "protobuf: updated to ${{ env.COMMIT_SHA }}"
          base: main
          branch: update-protobufs
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          commit-message: |
            protobuf: updated to ${{ env.COMMIT_SHA }}

            see https://github.com/SteamDatabase/GameTracking-CSGO
          body: |
            see https://github.com/SteamDatabase/GameTracking-CSGO

      - name: Print PR outputs
        if: env.PROTOBUFS_CHANGED == 'true'
        run: |
          echo "Pull Request Number - ${{ env.PULL_REQUEST_NUMBER }}"
          echo "Pull Request Number - ${{ steps.pr.outputs.pull-request-number }}"
