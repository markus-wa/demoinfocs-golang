package com.github.markus_wa.demoinfocs_golang.v6;

import "v6/steammessages_unified_base.steamworkssdk.proto";

option cc_generic_services = true;

enum ENotificationSetting {
	k_ENotificationSettingNotifyUseDefault = 0;
	k_ENotificationSettingAlways = 1;
	k_ENotificationSettingNever = 2;
}

message CPlayer_GetMutualFriendsForIncomingInvites_Request {
}

message CPlayer_IncomingInviteMutualFriendList {
	optional fixed64 steamid = 1;
	repeated uint32 mutual_friend_account_ids = 2;
}

message CPlayer_GetMutualFriendsForIncomingInvites_Response {
	repeated .com.github.markus_wa.demoinfocs_golang.v6.CPlayer_IncomingInviteMutualFriendList incoming_invite_mutual_friends_lists = 1;
}

message CPlayer_GetFriendsGameplayInfo_Request {
	optional uint32 appid = 1;
}

message CPlayer_GetFriendsGameplayInfo_Response {
	message FriendsGameplayInfo {
		optional fixed64 steamid = 1;
		optional uint32 minutes_played = 2;
		optional uint32 minutes_played_forever = 3;
	}

	message OwnGameplayInfo {
		optional fixed64 steamid = 1;
		optional uint32 minutes_played = 2;
		optional uint32 minutes_played_forever = 3;
		optional bool in_wishlist = 4;
		optional bool owned = 5;
	}

	optional .com.github.markus_wa.demoinfocs_golang.v6.CPlayer_GetFriendsGameplayInfo_Response.OwnGameplayInfo your_info = 1;
	repeated .com.github.markus_wa.demoinfocs_golang.v6.CPlayer_GetFriendsGameplayInfo_Response.FriendsGameplayInfo in_game = 2;
	repeated .com.github.markus_wa.demoinfocs_golang.v6.CPlayer_GetFriendsGameplayInfo_Response.FriendsGameplayInfo played_recently = 3;
	repeated .com.github.markus_wa.demoinfocs_golang.v6.CPlayer_GetFriendsGameplayInfo_Response.FriendsGameplayInfo played_ever = 4;
	repeated .com.github.markus_wa.demoinfocs_golang.v6.CPlayer_GetFriendsGameplayInfo_Response.FriendsGameplayInfo owns = 5;
	repeated .com.github.markus_wa.demoinfocs_golang.v6.CPlayer_GetFriendsGameplayInfo_Response.FriendsGameplayInfo in_wishlist = 6;
}

message CPlayer_GetGameBadgeLevels_Request {
	optional uint32 appid = 1;
}

message CPlayer_GetGameBadgeLevels_Response {
	message Badge {
		optional int32 level = 1;
		optional int32 series = 2;
		optional uint32 border_color = 3;
	}

	optional uint32 player_level = 1;
	repeated .com.github.markus_wa.demoinfocs_golang.v6.CPlayer_GetGameBadgeLevels_Response.Badge badges = 2;
}

message CPlayer_GetLastPlayedTimes_Request {
	optional uint32 min_last_played = 1;
}

message CPlayer_GetLastPlayedTimes_Response {
	message Game {
		optional int32 appid = 1;
		optional uint32 last_playtime = 2;
		optional int32 playtime_2weeks = 3;
		optional int32 playtime_forever = 4;
		optional uint32 first_playtime = 5;
	}

	repeated .com.github.markus_wa.demoinfocs_golang.v6.CPlayer_GetLastPlayedTimes_Response.Game games = 1;
}

message CPlayer_AcceptSSA_Request {
}

message CPlayer_AcceptSSA_Response {
}

message CPlayer_GetNicknameList_Request {
}

message CPlayer_GetNicknameList_Response {
	message PlayerNickname {
		optional fixed32 accountid = 1;
		optional string nickname = 2;
	}

	repeated .com.github.markus_wa.demoinfocs_golang.v6.CPlayer_GetNicknameList_Response.PlayerNickname nicknames = 1;
}

message CPlayer_GetPerFriendPreferences_Request {
}

message PerFriendPreferences {
	optional fixed32 accountid = 1;
	optional string nickname = 2;
	optional .com.github.markus_wa.demoinfocs_golang.v6.ENotificationSetting notifications_showingame = 3 [default = k_ENotificationSettingNotifyUseDefault];
	optional .com.github.markus_wa.demoinfocs_golang.v6.ENotificationSetting notifications_showonline = 4 [default = k_ENotificationSettingNotifyUseDefault];
	optional .com.github.markus_wa.demoinfocs_golang.v6.ENotificationSetting notifications_showmessages = 5 [default = k_ENotificationSettingNotifyUseDefault];
	optional .com.github.markus_wa.demoinfocs_golang.v6.ENotificationSetting sounds_showingame = 6 [default = k_ENotificationSettingNotifyUseDefault];
	optional .com.github.markus_wa.demoinfocs_golang.v6.ENotificationSetting sounds_showonline = 7 [default = k_ENotificationSettingNotifyUseDefault];
	optional .com.github.markus_wa.demoinfocs_golang.v6.ENotificationSetting sounds_showmessages = 8 [default = k_ENotificationSettingNotifyUseDefault];
	optional .com.github.markus_wa.demoinfocs_golang.v6.ENotificationSetting notifications_sendmobile = 9 [default = k_ENotificationSettingNotifyUseDefault];
}

message CPlayer_GetPerFriendPreferences_Response {
	repeated .com.github.markus_wa.demoinfocs_golang.v6.PerFriendPreferences preferences = 1;
}

message CPlayer_SetPerFriendPreferences_Request {
	optional .com.github.markus_wa.demoinfocs_golang.v6.PerFriendPreferences preferences = 1;
}

message CPlayer_SetPerFriendPreferences_Response {
}

message CPlayer_AddFriend_Request {
	optional fixed64 steamid = 1;
}

message CPlayer_AddFriend_Response {
	optional bool invite_sent = 1;
	optional uint32 friend_relationship = 2;
}

message CPlayer_RemoveFriend_Request {
	optional fixed64 steamid = 1;
}

message CPlayer_RemoveFriend_Response {
	optional uint32 friend_relationship = 1;
}

message CPlayer_IgnoreFriend_Request {
	optional fixed64 steamid = 1;
	optional bool unignore = 2;
}

message CPlayer_IgnoreFriend_Response {
	optional uint32 friend_relationship = 1;
}

message CPlayer_GetCommunityPreferences_Request {
}

message CPlayer_CommunityPreferences {
	optional bool hide_adult_content_violence = 1 [default = true];
	optional bool hide_adult_content_sex = 2 [default = true];
	optional bool parenthesize_nicknames = 4 [default = false];
	optional uint32 timestamp_updated = 3;
}

message CPlayer_GetCommunityPreferences_Response {
	optional .com.github.markus_wa.demoinfocs_golang.v6.CPlayer_CommunityPreferences preferences = 1;
}

message CPlayer_SetCommunityPreferences_Request {
	optional .com.github.markus_wa.demoinfocs_golang.v6.CPlayer_CommunityPreferences preferences = 1;
}

message CPlayer_SetCommunityPreferences_Response {
}

message CPlayer_GetNewSteamAnnouncementState_Request {
	optional int32 language = 1;
}

message CPlayer_GetNewSteamAnnouncementState_Response {
	optional int32 state = 1;
	optional string announcement_headline = 2;
	optional string announcement_url = 3;
	optional uint32 time_posted = 4;
	optional uint64 announcement_gid = 5;
}

message CPlayer_UpdateSteamAnnouncementLastRead_Request {
	optional uint64 announcement_gid = 1;
	optional uint32 time_posted = 2;
}

message CPlayer_UpdateSteamAnnouncementLastRead_Response {
}

service Player {

	rpc GetMutualFriendsForIncomingInvites (.com.github.markus_wa.demoinfocs_golang.v6.CPlayer_GetMutualFriendsForIncomingInvites_Request) returns (.com.github.markus_wa.demoinfocs_golang.v6.CPlayer_GetMutualFriendsForIncomingInvites_Response) {
	}

	rpc GetFriendsGameplayInfo (.com.github.markus_wa.demoinfocs_golang.v6.CPlayer_GetFriendsGameplayInfo_Request) returns (.com.github.markus_wa.demoinfocs_golang.v6.CPlayer_GetFriendsGameplayInfo_Response) {
	}

	rpc GetGameBadgeLevels (.com.github.markus_wa.demoinfocs_golang.v6.CPlayer_GetGameBadgeLevels_Request) returns (.com.github.markus_wa.demoinfocs_golang.v6.CPlayer_GetGameBadgeLevels_Response) {
	}

	rpc ClientGetLastPlayedTimes (.com.github.markus_wa.demoinfocs_golang.v6.CPlayer_GetLastPlayedTimes_Request) returns (.com.github.markus_wa.demoinfocs_golang.v6.CPlayer_GetLastPlayedTimes_Response) {
	}

	rpc AcceptSSA (.com.github.markus_wa.demoinfocs_golang.v6.CPlayer_AcceptSSA_Request) returns (.com.github.markus_wa.demoinfocs_golang.v6.CPlayer_AcceptSSA_Response) {
	}

	rpc GetNicknameList (.com.github.markus_wa.demoinfocs_golang.v6.CPlayer_GetNicknameList_Request) returns (.com.github.markus_wa.demoinfocs_golang.v6.CPlayer_GetNicknameList_Response) {
	}

	rpc GetPerFriendPreferences (.com.github.markus_wa.demoinfocs_golang.v6.CPlayer_GetPerFriendPreferences_Request) returns (.com.github.markus_wa.demoinfocs_golang.v6.CPlayer_GetPerFriendPreferences_Response) {
	}

	rpc SetPerFriendPreferences (.com.github.markus_wa.demoinfocs_golang.v6.CPlayer_SetPerFriendPreferences_Request) returns (.com.github.markus_wa.demoinfocs_golang.v6.CPlayer_SetPerFriendPreferences_Response) {
	}

	rpc AddFriend (.com.github.markus_wa.demoinfocs_golang.v6.CPlayer_AddFriend_Request) returns (.com.github.markus_wa.demoinfocs_golang.v6.CPlayer_AddFriend_Response) {
	}

	rpc RemoveFriend (.com.github.markus_wa.demoinfocs_golang.v6.CPlayer_RemoveFriend_Request) returns (.com.github.markus_wa.demoinfocs_golang.v6.CPlayer_RemoveFriend_Response) {
	}

	rpc IgnoreFriend (.com.github.markus_wa.demoinfocs_golang.v6.CPlayer_IgnoreFriend_Request) returns (.com.github.markus_wa.demoinfocs_golang.v6.CPlayer_IgnoreFriend_Response) {
	}

	rpc GetCommunityPreferences (.com.github.markus_wa.demoinfocs_golang.v6.CPlayer_GetCommunityPreferences_Request) returns (.com.github.markus_wa.demoinfocs_golang.v6.CPlayer_GetCommunityPreferences_Response) {
	}

	rpc SetCommunityPreferences (.com.github.markus_wa.demoinfocs_golang.v6.CPlayer_SetCommunityPreferences_Request) returns (.com.github.markus_wa.demoinfocs_golang.v6.CPlayer_SetCommunityPreferences_Response) {
	}

	rpc GetNewSteamAnnouncementState (.com.github.markus_wa.demoinfocs_golang.v6.CPlayer_GetNewSteamAnnouncementState_Request) returns (.com.github.markus_wa.demoinfocs_golang.v6.CPlayer_GetNewSteamAnnouncementState_Response) {
	}

	rpc UpdateSteamAnnouncementLastRead (.com.github.markus_wa.demoinfocs_golang.v6.CPlayer_UpdateSteamAnnouncementLastRead_Request) returns (.com.github.markus_wa.demoinfocs_golang.v6.CPlayer_UpdateSteamAnnouncementLastRead_Response) {
	}
}
